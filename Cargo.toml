[package]
name = "redjubjub"
edition = "2021"
rust-version = "1.88"
# When releasing to crates.io:
# - Update CHANGELOG.md
# - Create git tag.
version = "0.8.0"
authors = ["Henry de Valence <hdevalence@hdevalence.ca>", "Deirdre Connolly <durumcrustulum@gmail.com>", "Chelsea Komlo <me@chelseakomlo.com>", "Daira-Emma Hopwood <daira@jacaranda.org>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZcashFoundation/redjubjub"
categories = ["cryptography"]
keywords = ["cryptography", "crypto", "jubjub", "redjubjub", "zcash"]
description = "A standalone implementation of the RedJubjub signature scheme."

[package.metadata.docs.rs]
features = ["nightly"]

[dependencies]
reddsa = { git = "https://github.com/nuttycom/reddsa.git", rev = "d0b05e4f691e9562b1c3997cd0dc115af3e4bc8c", default-features = false, features = ["alloc"] }
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
thiserror = { version = "1.0", optional = true }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }

[dev-dependencies]
bincode = "1"
criterion = "0.5"
lazy_static = "1.4"
proptest = "1.0"
rand = "0.10"
rand_chacha = "0.10"
serde_json = "1.0"

[features]
nightly = []
default = ["serde", "std", "zeroize"]
std = ["dep:thiserror", "reddsa/std"]
zeroize = ["reddsa/zeroize"]

[[bench]]
name = "bench"
harness = false

[patch.crates-io]
jubjub = { git = "https://github.com/nuttycom/jubjub.git", rev = "b702b55c0f6a23ff5d867e52a8d815904c45a36e" }
bls12_381 = { git = "https://github.com/dannywillems/bls12_381.git", rev = "90261e682a44da54ffbc0089ac5aea105ec74cbf" }
pasta_curves = { git = "https://github.com/zcash/pasta_curves.git", rev = "437d3c08eef2cd7a3c137c2d02e4bce246b1e243" }
