name: Release Drafter

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      # release-drafter creates and updates the draft release, and reads
      # the merged pull requests to build the notes. It does not label
      # anything, so read access to pull requests is enough.
      contents: write
      pull-requests: read
    steps:
      # Drafts your next Release notes as Pull Requests are merged into main
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        with:
          # (Optional) specify config name to use, relative to .github/. Default: release-drafter.yml
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
